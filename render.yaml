services:
  - type: web
    name: payout-engine
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn payout_engine.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_DB
        value: "postgres"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      services:
        - type: web
          name: payout-engine
          env: python
          plan: free
          buildCommand: pip install -r requirements.txt
          startCommand: gunicorn payout_engine.wsgi:application --bind 0.0.0.0:$PORT
          envVars:
            - key: DEBUG
              value: "False"
            - key: DJANGO_DB
              value: "postgres"
            - key: SECRET_KEY
              generateValue: true
            - key: DATABASE_URL
              fromDatabase:
                name: payout-db
                property: connectionString
            - key: CELERY_BROKER_URL
              fromService:
                name: redis-cache
                type: redis
                property: connectionString
            - key: CELERY_RESULT_BACKEND
              fromService:
                name: redis-cache
                type: redis
                property: connectionString

        - type: redis
          name: redis-cache
          plan: free
          ipAllowList: []

      databases:
        - name: payout-db
          plan: free
        fromService:
