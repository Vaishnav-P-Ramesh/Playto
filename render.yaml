services:
  - type: web
    name: payout-engine
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn payout_engine.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_DB
        value: "postgres"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redis-cache
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redis-cache
          type: redis
          property: connectionString

  - type: worker
    name: payout-worker
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A payout_engine worker --loglevel=info
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_DB
        value: "postgres"
      - key: SECRET_KEY
        fromService:
          name: payout-engine
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redis-cache
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redis-cache
          type: redis
          property: connectionString

  - type: worker
    name: payout-beat
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A payout_engine beat --loglevel=info
    envVars:
      - key: DEBUG
        value: "False"
      - key: DJANGO_DB
        value: "postgres"
      - key: SECRET_KEY
        fromService:
          name: payout-engine
          type: web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: redis-cache
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: redis-cache
          type: redis
          property: connectionString

databases:
  - name: payout-db
    engine: postgres
    plan: free
    postgresVersion: "15"

redis:
  - name: redis-cache
    plan: free
